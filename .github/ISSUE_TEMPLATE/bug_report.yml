name: Bug report
description: Report a reproducible H3 Flow problem without sharing private media or paths.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload private prompts, reference media, credentials, model files, or absolute user paths.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Workflow mode
      options: [Text to video, First-frame image to video, Ref2VA identity/style, Long video, Studio restoration, Environment detection]
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Sanitized compatibility result
      description: Paste component names and versions only. Remove paths and media filenames.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal data, credentials, private media, and absolute user paths.
          required: true
